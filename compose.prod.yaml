name: nebula-prod

services:
    client:
        build:
            context: ./client
            dockerfile: Dockerfile.prod
        init: true
        restart: unless-stopped
        ports:
            - "127.0.0.1:${CLIENT_PORT:-3000}:3000"
        environment:
            API_INTERNAL_URL: http://server:8000
        depends_on:
            server:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 10s
            start_period: 30s
            retries: 3

    server:
        build:
            context: ./server
            dockerfile: Dockerfile.prod
        init: true
        restart: unless-stopped
        ports:
            - "127.0.0.1:${SERVER_PORT:-8000}:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
            interval: 30s
            timeout: 10s
            start_period: 10s
            retries: 3
